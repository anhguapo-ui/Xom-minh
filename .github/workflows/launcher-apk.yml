name: Build CarDash APK

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CarDash-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CarDash-apk
          path: launcher/CarDash-${{ github.run_number }}.apk
      # Bản mới nhất luôn có link tải trực tiếp cố định:
      # https://github.com/<owner>/<repo>/releases/download/cardash-latest/CarDash.apk
      - name: Publish direct download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp CarDash-${{ github.run_number }}.apk CarDash.apk
          gh release view cardash-latest >/dev/null 2>&1 || \
            gh release create cardash-latest --prerelease --target "$GITHUB_SHA" \
              --title "CarDash" --notes "Ban build moi nhat cua launcher CarDash."
          gh release upload cardash-latest CarDash.apk --clobber
          gh release edit cardash-latest --title "CarDash ban ${{ github.run_number }}"

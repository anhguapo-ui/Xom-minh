name: Build CarDash APK

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CarDash-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CarDash-apk
          path: launcher/CarDash-${{ github.run_number }}.apk

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C66">
<meta name="description" content="Xóm Mình – bản demo: điểm danh, rủ kèo, miếu Thần Tài cho hội bạn và các gia đình.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='22' cy='32' r='14' fill='%23E8962A'/%3E%3Ccircle cx='44' cy='32' r='14' fill='%230E7C66'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Xóm Mình</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@700&display=swap">
<style>
/* Layout: one phone-width column, sticky header, 5-tab bottom bar; cards only for things you act on */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --ink:#1B2A27; --muted:#566963; --line:#D8E2DE;
  --accent:#0E7C66; --accent-ink:#FFFFFF; --accent-soft:#DCEFE9;
  --sun:#E8962A; --sun-soft:#FCEFD9; --sun-ink:#7A4A06;
  --danger:#BF4637; --shadow:0 1px 2px rgba(20,40,35,.06),0 6px 18px rgba(20,40,35,.06);
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"Noto Serif",Georgia,serif;
  --nav-h:66px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#16211E; --ink:#E4EEEA; --muted:#9AADA6; --line:#283632;
  --accent:#3DBE9C; --accent-ink:#06120F; --accent-soft:#163A31;
  --sun:#F0AE4C; --sun-soft:#3A2D16; --sun-ink:#F6CF8E;
  --danger:#E57B6E; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#16211E; --ink:#E4EEEA; --muted:#9AADA6; --line:#283632;
  --accent:#3DBE9C; --accent-ink:#06120F; --accent-soft:#163A31;
  --sun:#F0AE4C; --sun-soft:#3A2D16; --sun-ink:#F6CF8E;
  --danger:#E57B6E; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.app.claiming{padding-bottom:40px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;display:flex;align-items:center;gap:8px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--sun);box-shadow:14px 0 0 var(--accent)}
.brand span{margin-left:14px}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;font-size:14px;font-weight:600;min-height:44px}
.demo-tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sun-ink);background:var(--sun-soft);border-radius:6px;padding:2px 8px;display:inline-block}

.av{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:13px;flex:none;letter-spacing:-.02em;
  background:color-mix(in srgb,hsl(var(--h) 65% 50%) 24%,var(--surface));color:var(--ink);border:2px solid var(--surface)}
.av.sm{width:30px;height:30px;font-size:11.5px}
.stack{display:flex}.stack .av{margin-left:-8px}.stack .av:first-child{margin-left:0}

h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;margin:6px 0 2px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:21px;margin:0;line-height:1.2}
.sub{color:var(--muted);margin:0}
.small{font-size:14px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:0 4px;font-size:15px;min-height:44px}
.view{display:flex;flex-direction:column}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.checkin{background:var(--accent);color:var(--accent-ink);border:0;margin-top:16px}
.checkin h2{color:var(--accent-ink)}
.checkin p{margin:4px 0 12px;opacity:.9;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.checkin .chip{background:color-mix(in srgb,var(--accent-ink) 15%,transparent);border-color:transparent;color:var(--accent-ink)}
.checkin .chip[aria-pressed="true"]{background:var(--accent-ink);color:var(--accent)}
.done-strip{margin-top:16px;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;background:var(--accent-soft);border:0;box-shadow:none}
.done-strip .em{font-size:26px}
.done-strip .grow{flex:1;min-width:0;line-height:1.3}
.streak{font-family:var(--f-display);font-weight:800;font-size:15px;background:var(--sun);color:#2B1A02;border-radius:999px;padding:2px 12px;white-space:nowrap}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:60px}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.name{font-weight:700;line-height:1.3}
.meta{color:var(--muted);font-size:14px}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pst{font-size:13.5px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--accent-soft);white-space:nowrap}
.pst.off{background:var(--bg);color:var(--muted);font-weight:500}
.pst.maybe{background:var(--sun-soft);color:var(--sun-ink)}
.pst.none{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:500}

.kcard{display:flex;flex-direction:column;gap:12px}
.ktop{display:flex;gap:12px;align-items:flex-start;background:none;border:0;padding:0;text-align:left;width:100%}
.kicon{width:48px;height:48px;border-radius:14px;background:var(--sun-soft);display:grid;place-items:center;font-size:25px;flex:none}
.ktitle{font-weight:700;font-size:17px;line-height:1.3}
.kmeta{color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:1px;margin-top:2px}
.kwhen{font-weight:600;color:var(--ink)}
.badge{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;margin-left:auto;flex:none}
.badge.lock{background:var(--accent);color:var(--accent-ink)}
.badge.wait{background:var(--sun-soft);color:var(--sun-ink)}
.progress{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.progress small{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rsvp button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;font-weight:700;font-size:15px;min-height:46px}
.rsvp button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.rsvp button.maybe[aria-pressed="true"]{border-color:var(--sun);background:var(--sun-soft);color:var(--sun-ink)}
.rsvp button.no[aria-pressed="true"]{border-color:var(--line);background:var(--bg);color:var(--muted)}
.going{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.kfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}

.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:48px;font-size:16px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.sun{background:var(--sun);color:#2B1A02}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:14px}
.seg button{min-height:42px;border:0;background:none;border-radius:10px;font-weight:700;color:var(--muted);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.pipin{background:var(--sun);color:#2B1A02;font-size:11px;border-radius:99px;padding:0 6px;margin-left:4px}

.host-open{border:2px dashed var(--sun);background:var(--sun-soft);box-shadow:none}
.host-open .ktitle{color:var(--sun-ink)}
.hostline{display:flex;align-items:center;gap:10px;font-size:15px}
.note{font-size:15px;background:var(--bg);border-radius:12px;padding:10px 12px;margin:0}
.gold .rank{font-family:var(--f-display);font-weight:800;font-size:20px;width:26px;text-align:center;color:var(--sun)}
.back{background:none;border:0;color:var(--accent);font-weight:700;font-size:16px;padding:0;min-height:44px;align-self:flex-start}

.fam-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.fam-grid{grid-template-columns:1fr}}
.fam{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fam.mine{border-color:var(--accent)}
.fam .name{font-size:15px}
.fam .meta{font-size:13.5px}
.pending{font-size:13px;color:var(--sun-ink);background:var(--sun-soft);border-radius:8px;padding:4px 8px}
.pending button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0;font-size:13px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--bg);color:var(--muted)}
.tag.hot{background:var(--sun-soft);color:var(--sun-ink)}
.date{width:48px;flex:none;text-align:center;border-radius:12px;background:var(--accent-soft);padding:4px 0;line-height:1.1}
.date b{display:block;font-family:var(--f-display);font-size:21px}
.date small{font-size:12px;font-weight:600;color:var(--muted)}

.poll button{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;position:relative;overflow:hidden;margin-top:8px;min-height:46px}
.poll button[aria-pressed="true"]{border-color:var(--accent)}
.poll .fill{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);transition:width .3s}
.poll .lbl{position:relative;display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:15px}
.poll .lbl small{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}

/* chat */
.thread{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;min-width:0;overflow-wrap:anywhere}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink);border-color:transparent;border-radius:16px 16px 4px 16px}
.bubble .by{font-size:13px;font-weight:700;color:var(--accent);display:block}
.bubble .tm{font-size:12px;opacity:.7;display:block;text-align:right}
.sys{align-self:center;font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;text-align:center;max-width:95%}
.pin{display:flex;gap:10px;align-items:flex-start;background:var(--sun-soft);color:var(--sun-ink);border-radius:14px;padding:10px 12px;font-size:14.5px}
.pin b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.composer{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding-block:10px;margin-top:12px;z-index:4}
.composer input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--surface);min-height:46px}
.composer button{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 18px;min-height:46px}
.day-sep{align-self:center;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* altar: a deliberately single-look panel, same in both themes */
.altar{border-radius:20px;overflow:hidden;background:#3A0D0B;box-shadow:var(--shadow);margin-top:14px}
.altar svg{display:block;width:100%;height:auto}
.smoke{fill:none;stroke:rgba(255,240,225,.42);stroke-width:2.4;stroke-linecap:round;animation:rise 4.2s ease-in infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes rise{0%{opacity:0;transform:translateY(8px) scaleY(.6)}30%{opacity:.85}100%{opacity:0;transform:translateY(-26px) scaleY(1.15)}}
.flame{animation:flick 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(.86,1.1)}}
.ember{animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.55}}
.lunar{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:14px}
.lunar .moon{width:44px;height:44px;border-radius:50%;flex:none;background:var(--sun-soft);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--sun-ink);font-size:18px}
details.prayer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px}
details.prayer summary{font-weight:700;min-height:48px;display:flex;align-items:center;cursor:pointer}
details.prayer p{white-space:pre-line;font-family:var(--f-serif);font-weight:400;font-size:15.5px;line-height:1.75;margin:0 0 14px}
.altar-teaser{display:flex;gap:12px;align-items:center;background:#4A1310;color:#F6E3C2;border-radius:18px;padding:14px;margin-top:14px}
.altar-teaser .grow{flex:1;min-width:0;line-height:1.35}
.altar-teaser b{color:#F6D27A}
.altar-teaser button{background:#F6D27A;color:#3A0D0B;border:0;border-radius:12px;font-weight:700;padding:0 14px;min-height:44px;white-space:nowrap}

/* claim flow */
.claim{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.hello{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:22px 18px}
.hello h1{color:var(--accent-ink);margin:4px 0}
.hello p{margin:0;opacity:.9}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;min-height:64px;font-weight:700;font-size:17px}
.pick:disabled{opacity:.6;cursor:default}
.pick small{display:block;font-weight:500;font-size:14px;color:var(--muted)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;min-height:52px;font-weight:700;font-size:16px;width:100%}
.gbtn i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-weight:800}
.steps{display:flex;gap:6px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--accent)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12.5px;font-weight:600;color:var(--muted);min-height:56px;position:relative}
nav.tabs button svg{width:25px;height:25px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .pip{position:absolute;top:2px;left:calc(50% + 6px);background:var(--sun);color:#2B1A02;font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;line-height:17px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;max-height:90%;overflow:auto;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
form.stackf{display:flex;flex-direction:column;gap:14px}
label.f{font-size:14px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px;min-width:0}
.f input,.f textarea,.f select,.kid-row input{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);font-size:16px;width:100%;min-height:46px;color:var(--ink)}
.check{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kid-row{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;align-items:center}
.kid-row button{min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-size:18px;color:var(--muted)}
.group-title{font-family:var(--f-display);font-weight:700;font-size:18px;margin:6px 0 -4px}
.linkbox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:1.5px dashed var(--accent);border-radius:12px;padding:12px;font-size:15px;overflow-wrap:anywhere;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}

/* chibi + miếu */
.av{overflow:hidden;padding:0}
.av svg{width:100%;height:100%;display:block}
.fav{display:inline-flex;flex:none}
.fav .av{margin-left:0}.fav .av+.av{margin-left:-12px}
.stack .fav{margin-left:-10px}.stack .fav:first-child{margin-left:0}
.gate{display:flex;gap:12px;align-items:center;background:linear-gradient(160deg,#5A1712,#33100C);color:#F6E3C2;border-radius:18px;padding:10px 14px 10px 8px;margin-top:14px;border:0;width:100%;text-align:left;font:inherit;box-shadow:var(--shadow)}
.gate svg{width:96px;flex:none}
.gate .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.35}
.gate b{color:#F6D27A;font-family:var(--f-display);font-size:19px;font-weight:800}
.gate .g-meta{font-size:14px;opacity:.92}

const adults=f=>f.members.filter(m=>m.role==='adult');

const me=()=>person(S.me);
const myFam=()=>me().fam;
const famShort=f=>adults(f).map(m=>m.n).join(' & ');
const famName=f=>f.id===myFam().id?'Nhà mình':'Nhà '+famShort(f);
const famAv=(f,sm)=>`<span class="fav" title="${esc(famName(f))}">${adults(f).slice(0,2).map(m=>`<span class="av${sm?' sm':''}" style="--h:${f.h}">${headSVG(m.id)}</span>`).join('')}</span>`;
const pAv=(pid,sm)=>{const p=person(pid);if(!p)return '';return `<span class="av${sm?' sm':''}" style="--h:${p.fam.h}" title="${esc(p.n)}">${headSVG(pid)}</span>`};
const yesOf=r=>Object.keys(r).filter(k=>r[k]==='yes'&&person(k));
const maybeOf=r=>Object.keys(r).filter(k=>r[k]==='maybe'&&person(k));
const isAdmin=()=>S.admins.includes(S.me);
function nextOcc(dob){if(!dob)return null;const [y,m,d]=dob.split('-').map(Number);const t0=new Date(now);t0.setHours(0,0,0,0);
  let c=new Date(now.getFullYear(),m-1,d);if(c<t0)c=new Date(now.getFullYear()+1,m-1,d);return {t:c.getTime(),years:c.getFullYear()-y}}
function events(win){const out=[];
  S.fams.forEach(f=>{f.members.forEach(m=>{const o=nextOcc(m.dob);if(!o)return;
      let t;if(m.role==='kid')t=o.years===1?'Thôi nôi bé '+m.n:'Sinh nhật bé '+m.n+' · tròn '+o.years+' tuổi';else t='Sinh nhật '+m.n;
      out.push({t:o.t,label:t,kind:m.role==='kid'&&o.years===1?'Thôi nôi':'Sinh nhật',f})});
    const w=nextOcc(f.wed);if(w&&w.years>0)out.push({t:w.t,label:'Kỷ niệm '+w.years+' năm cưới',kind:'Ngày cưới',f})});
  return out.filter(e=>dayDiff(e.t)<=(win||45)).sort((a,b)=>a.t-b.t)}
const altarToday=()=>S.altar[today]||[];
const litFams=()=>[...new Set(altarToday().map(e=>person(e.pid)&&person(e.pid).fam.id).filter(Boolean))];
function post(ch,msg){(S.chat[ch]=S.chat[ch]||[]).push(Object.assign({t:Date.now()},msg))}

function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}

function rsvpBtns(act,id,mine,labels){labels=labels||['Đi luôn','Để xem','Không đi'];
  return `<div class="rsvp" role="group" aria-label="Trả lời">
    <button data-act="${act}" data-id="${id}" data-v="yes" aria-pressed="${mine==='yes'}">${labels[0]}</button>
    <button class="maybe" data-act="${act}" data-id="${id}" data-v="maybe" aria-pressed="${mine==='maybe'}">${labels[1]}</button>
    <button class="no" data-act="${act}" data-id="${id}" data-v="no" aria-pressed="${mine==='no'}">${labels[2]}</button></div>`}
function keoHead(k){const y=yesOf(k.rsvp),ok=y.length>=k.min,t=ty(k.type);
  return `<div class="kicon" aria-hidden="true">${t.e}</div>
    <div style="min-width:0;flex:1"><div class="ktitle">${esc(k.title)}</div>
      <div class="kmeta"><span class="kwhen">${when(k.when)}</span><span>${esc(k.place)}</span><span>${esc(person(k.host).n)} rủ</span></div></div>
    <span class="badge ${ok?'lock':'wait'}">${ok?'Chốt kèo!':'Cần thêm '+(k.min-y.length)}</span>`}
function progress(k){const y=yesOf(k.rsvp);return `<div class="progress"><div class="bar"><i style="width:${Math.min(100,y.length/k.min*100)}%"></i></div><small>${y.length}/${k.min} người đi</small></div>`}
function keoCard(k){
  const y=yesOf(k.rsvp),m=maybeOf(k.rsvp),c=(S.chat[k.id]||[]).length;
  return `<article class="card kcard">
    <button class="ktop" data-act="open-keo" data-id="${k.id}" aria-label="Xem chi tiết ${esc(k.title)}">${keoHead(k)}</button>
    ${progress(k)}
    <div class="kfoot"><div class="going">${y.length?`<span class="stack">${y.slice(0,6).map(id=>pAv(id,true)).join('')}</span>`:''}${m.length?`<span>${m.length} người để xem</span>`:''}</div>
      <button class="link" data-act="open-keo" data-id="${k.id}">💬 ${c?c+' tin · ':''}Chi tiết</button></div>
    ${rsvpBtns('rsvp',k.id,k.rsvp[S.me]||'')}

}
function whoGoing(r){
  const fams=S.fams.filter(f=>adults(f).some(m=>r[m.id]));
  const pending=people().filter(p=>!r[p.id]).length;

  return `<div class="list">${fams.map(f=>`<div class="row">${famAv(f)}<div class="grow"><div class="name">${esc(famName(f))}</div>
    <div class="people">${adults(f).map(m=>{const v=r[m.id];if(!m.claimed)return '';const L=v?lbl[v]:['Chưa trả lời','none'];return `<span class="pst ${L[1]}">${esc(m.n)}: ${L[0]}</span>`}).join('')}</div></div></div>`).join('')}
    ${pending?`<div class="row"><span class="meta">${pending} người chưa trả lời</span></div>`:''}</div>`}
function thread(msgs){
  if(!msgs||!msgs.length)return '<p class="sub small" style="text-align:center">Chưa có tin nhắn nào. Mở lời trước nhé!</p>';
  let last='';
  return `<div class="thread">${msgs.map(m=>{let sep='';const k=dayKey(m.t);if(k!==last){last=k;const d=dayDiff(m.t);sep=`<div class="day-sep">${d===0?'Hôm nay':d===-1?'Hôm qua':dm(m.t)}</div>`}
    if(m.sys)return sep+`<div class="sys">${esc(m.x)} · ${hm(m.t)}</div>`;
    const p=person(m.pid);if(!p)return sep;const mine=m.pid===S.me;
    return sep+`<div class="msg${mine?' me':''}">${mine?'':pAv(m.pid,true)}<div class="bubble">${mine?'':`<span class="by">${esc(p.n)}</span>`}${esc(m.x)}<span class="tm">${hm(m.t)}</span></div></div>`}).join('')}</div>`}

function playLight(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f=myFam(),already=altarToday().some(e=>e.pid!==S.me&&person(e.pid)&&person(e.pid).fam.id===f.id);
  const ids=[S.me,...(already?[]:kids(f).map(k=>k.id))];
  S.tab='altar';S.detail=null;UI.center=true;
  if(reduce){render();scrollTo(0,0);toast('🙏 Nén hương đã thắp. Cầu cho nhà mình bình an, may mắn!');return}
  UI.anim={ids};render();scrollTo(0,0);
  const sc=document.getElementById('scene');
  const els=ids.map((id,i)=>{const kid=i>0,d=document.createElement('div');d.className='ch walking moving'+(kid?' kid':'');
    d.style.left=gx(-8-i*7)+'%';d.style.bottom=(kid?5:8)+'%';d.style.zIndex=150-i;d.innerHTML=chibiSVG(id);sc.appendChild(d);return d});
  const alive=()=>document.getElementById('scene')===sc;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{els.forEach((d,i)=>{d.style.setProperty('--t','2.4s');
    d.style.left=gx(i===0?50:i%2?41-i:59+i)+'%';d.style.bottom=(i===0?27:24)+'%'})}));
  setTimeout(()=>{if(!alive())return;els.forEach((d,i)=>{d.classList.remove('walking');d.classList.add('bowing');if(i===0)d.classList.add('praying')})},2500);
  setTimeout(()=>{if(!alive())return;els.forEach(d=>d.classList.remove('bowing','praying'));UI.anim={ids:[]};
    document.getElementById('altar-g').innerHTML=altarGroup([]);toast('🙏 Nén hương đã thắp. Cầu cho nhà mình bình an, may mắn!')},5000);
  setTimeout(()=>{if(!alive())return;const cast=sceneCast([]);
    els.forEach((d,i)=>{const c=cast.find(x=>x.pid===ids[i]);if(!c)return;d.style.setProperty('--t','1.4s');d.classList.add('walking');d.style.left=c.x+'%';d.style.bottom=c.b+'%'})},5400);
  setTimeout(()=>{UI.anim=null;if(alive()){const y=scrollY;render();scrollTo(0,y)}},6900);
}

function readFamForm(form){
  const f=famById(form.dataset.f);
  adults(f).forEach(m=>{m.n=form.querySelector('#n-'+m.id).value.trim()||m.n;m.dob=form.querySelector('#d-'+m.id).value});

  meP.phone=form.querySelector('#phone').value.trim();meP.phonePub=form.querySelector('#phone-pub').checked;

  const n=f.id.slice(1);let i=0;

  f.members=adults(f).concat(ks);
  f.ab=f.id==='f0'?f.ab:adults(f).map(m=>m.n.split(' ').pop()[0]).join('');

}

function sheetMe(){
  sheet(`<button class="btn ghost" data-act="chibi">Sửa chibi của ${esc(me().n)}</button><h2>Xem với tư cách</h2><p class="sub small">Trong bản demo, chọn một người để thử trải nghiệm của họ.</p>
  <div class="list">${S.fams.map(f=>`<div class="row" style="flex-wrap:wrap">${famAv(f,true)}<div class="grow name">${esc('Nhà '+famShort(f))}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${adults(f).filter(m=>m.claimed).map(m=>`<button class="chip" data-act="set-me" data-id="${m.id}" aria-pressed="${m.id===S.me}">${esc(m.n)}</button>`).join('')}</div></div>`).join('')}</div>`)}
function sheetAltar(){
  sheet(`<h2>Thắp hương</h2><p class="sub small">Nén hương của ${esc(me().n)} sẽ cắm lên ban thờ chung của xóm.</p>
  <form id="altar-form" class="stackf">
    <div><div class="group-title" style="margin-bottom:8px">Dâng lễ</div>
    <div class="chips" id="offers">${OFFER.map((o,i)=>`<button type="button" class="chip" data-act="offer" data-k="${o.k}" aria-pressed="${i<2}">${o.t}</button>`).join('')}</div></div>
    <label class="f">Lời nguyện (không bắt buộc)<textarea id="a-wish" rows="3" maxlength="200" placeholder="VD: Cầu cho cả nhà mạnh khoẻ, công việc thuận lợi"></textarea></label>
    <label class="check"><input id="a-priv" type="checkbox"> Chỉ mình tôi thấy lời nguyện này</label>
    <button class="btn sun" type="submit">🙏 Thắp hương</button>
  </form>`)}
function sheetInvite(){
  sheet(`<h2>Mời một gia đình mới</h2><p class="sub small">Điền những gì bạn biết. Vợ chồng nhà đó sẽ tự sửa và bổ sung khi vào bằng link.</p>
  <form id="invite-form" class="stackf">
    <div class="two"><label class="f">Tên chồng<input id="i-a" required maxlength="30" placeholder="VD: Tùng"></label><label class="f">Tên vợ<input id="i-b" required maxlength="30" placeholder="VD: Hạnh"></label></div>
    <label class="f">Tên các bé, cách nhau bằng dấu phẩy<input id="i-k" maxlength="80" placeholder="VD: Bơ, Sữa"></label>
    <div class="two"><button type="button" class="btn ghost" data-act="close-btn">Huỷ</button><button class="btn" type="submit">Tạo link mời</button></div>
  </form>`)}
function sheetLink(fid){
  const f=famById(fid),url='xom-minh.app/moi/'+f.invite;
  const msg=`Mời nhà ${famShort(f)} vào Xóm Mình của hội mình nhé! Bấm link, chọn tên mình là xong: ${url}`;
  sheet(`<h2>Link mời nhà ${esc(famShort(f))}</h2>
  <p class="sub small">Link riêng cho nhà này, dùng được cho 2 người lớn, hết hạn sau 7 ngày. Gửi vào Zalo của vợ hoặc chồng nhà đó.</p>
  <div class="linkbox" id="msg-text">${esc(msg)}</div>
  <button class="btn" data-act="copy-link" data-msg="${esc(msg)}">Sao chép lời mời</button>
  <button class="btn ghost" data-act="preview-claim" data-f="${f.id}">Xem thử màn hình nhà đó nhận được</button>
  <p class="sub small">Địa chỉ link trong bản demo là ví dụ, chưa mở được.</p>`)}
function sheetFam(){sheet(`<h2>Hồ sơ nhà mình</h2>${famForm(myFam(),'Lưu hồ sơ')}`)}

/* ---------- Sự kiện ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='close'&&e.target!==b)return;
  switch(a){
    case 'tab':S.tab=b.dataset.k;S.detail=null;UI.confirmCancel=false;if(S.tab==='chat')UI.scrollChat=true;save();render();if(S.tab!=='chat')scrollTo(0,0);break;
    case 'enter-temple':S.tab='altar';S.detail=null;UI.enter=true;save();render();scrollTo(0,0);break;
    case 'char':{const p=person(b.dataset.p);if(!p)break;const e=altarToday().find(x=>x.pid===b.dataset.p);let txt;
      if(p.role==='kid')txt='Bé '+p.n+' đi lễ cùng bố mẹ';else if(e&&e.wish&&(!e.priv||e.pid===S.me))txt=p.n+': "'+e.wish+'"';else txt=p.n+(e?' đã thắp hương lúc '+hm(e.t):'');
      showSay(b,txt);break}
    case 'chibi':closeSheet();sheetChibi(S.me);break;
    case 'ed-who':ED.pid=b.dataset.p;renderEd();break;
    case 'ed-mode':setLook(ED.pid,{mode:b.dataset.k});save();renderEd();render();break;
    case 'ed-clear':setLook(ED.pid,{mode:'build',photo:''});save();renderEd();render();break;
    case 'ed-set':{const k=b.dataset.k;let v=b.dataset.v;if(k==='glasses')v=v==='true';setLook(ED.pid,{[k]:v,mode:k==='shirt'?look(ED.pid).mode:'build'});save();renderEd();render();break}
    case 'pan':{const sv=document.getElementById('scene-scroll');if(sv)sv.scrollTo({left:b.dataset.x==='0'?0:sv.scrollWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});break}
    case 'npc':if(b.dataset.k==='tu')sheetXam();else sheetThay('van');break;
    case 'xam-demo':UI.xam.demo=true;UI.xam.step='ask';renderXam();break;
    case 'xam-topic':UI.xam.topic=b.dataset.k;renderXam();break;
    case 'xam-shake':UI.xam.step='shake';renderXam();setTimeout(()=>{if(!UI.xam||UI.xam.step!=='shake')return;UI.xam.n=1+Math.floor(Math.random()*XAM.length);UI.xam.step='fell';renderXam()},1900);break;
    case 'xam-keo':{const X=UI.xam;X.step='keo';X.keo='flip';renderXam();setTimeout(()=>{if(UI.xam!==X)return;X.tries++;const r=Math.random();X.keo=X.tries>=3||r<.5?'ok':r<.75?'cuoi':'am';renderXam()},1100);break}
    case 'xam-read':{const X=UI.xam;X.step='result';S.xam=S.xam||{};S.xam[S.me]={date:today,n:X.n,topic:X.topic,demo:!!X.demo};save();renderXam();break}
    case 'xam-share':{const X=UI.xam,q=XAM[X.n-1];post('general',{sys:1,x:me().n+' vừa xin được quẻ số '+X.n+' · '+LV[q[0]]+' 🎋 "'+q[1][0]+'…"'});X.shared=true;if(S.xam&&S.xam[S.me])S.xam[S.me].shared=true;save();renderXam();render();toast('Đã khoe quẻ lên kênh chung');break}
    case 'thay-tab':UI.thay.tab=b.dataset.k;UI.thay.shown=false;renderThay();break;
    case 'thay-tuoi':UI.thay.a=document.getElementById('ty-a').value;UI.thay.b=document.getElementById('ty-b').value;UI.thay.shown=true;renderThay();break;
    case 'thay-keo':{const k=S.keo.find(x=>x.id===b.dataset.id);UI.thay.keo=k.id;UI.thay.date=dayKey(k.when);renderThay();break}
    case 'thay-from-keo':sheetThay('ngay',b.dataset.id);break;
    case 'thay-share':{const L=UI.thay.lastTuoi;if(L){post('general',{sys:1,x:'Thầy Lộc phán: '+L.a+' & '+L.b+' '+L.r.c+', mệnh '+L.r.m+'. '+L.r.v});save();render();toast('Đã khoe lên kênh chung')}break}
    case 'seg':S.sub=b.dataset.k;save();render();break;
    case 'open-keo':S.tab='keo';S.detail=b.dataset.id;UI.confirmCancel=false;save();render();scrollTo(0,0);break;
    case 'back':S.detail=null;UI.confirmCancel=false;save();render();break;
    case 'check-open':UI.checkOpen=true;render();break;
    case 'checkin':{const first=!S.checkins[S.me];S.checkins[S.me]={s:b.dataset.k,t:Date.now()};UI.checkOpen=false;
      if(first){S.streak[S.me]=(S.streak[S.me]||0)+1;toast('Điểm danh xong! Chuỗi '+S.streak[S.me]+' ngày 🔥')}else toast('Đã đổi trạng thái');save();render();break}
    case 'poke':toast('Đã ới '+people().filter(p=>!S.checkins[p.id]).length+' người chưa điểm danh');break;
    case 'rsvp':{const k=S.keo.find(x=>x.id===b.dataset.id),before=yesOf(k.rsvp).length>=k.min;
      if(k.rsvp[S.me]===b.dataset.v)delete k.rsvp[S.me];else k.rsvp[S.me]=b.dataset.v;
      const after=yesOf(k.rsvp).length>=k.min;if(!before&&after)post('general',{sys:1,x:'Kèo "'+k.title+'" đã đủ người, chốt kèo! 🔥'});
      save();render();if(!before&&after)toast('Đủ người rồi, chốt kèo "'+k.title+'"!');break}
    case 'cancel-ask':UI.confirmCancel=true;render();break;
    case 'cancel-no':UI.confirmCancel=false;render();break;
    case 'cancel-yes':{const k=S.keo.find(x=>x.id===b.dataset.id);S.keo=S.keo.filter(x=>x!==k);post('general',{sys:1,x:me().n+' đã huỷ kèo "'+k.title+'"'});S.detail=null;UI.confirmCancel=false;save();render();toast('Đã huỷ kèo và báo cho cả xóm');break}
    case 'hrsvp':{const h=S.hosts.find(x=>x.id===b.dataset.id);if(h.rsvp[S.me]===b.dataset.v)delete h.rsvp[S.me];else h.rsvp[S.me]=b.dataset.v;save();render();break}
    case 'volunteer':{const h=S.hosts.find(x=>x.id===b.dataset.id),f=myFam();h.fid=f.id;h.rsvp={};adults(f).forEach(m=>{if(m.claimed)h.rsvp[m.id]='yes'});
      h.note=h.note||'Nhà mình nhận đăng cai, mọi người đến chung vui nhé!';S.gold[f.id]=(S.gold[f.id]||0)+1;
      post('general',{sys:1,x:'Nhà '+famShort(f)+' xung phong đăng cai "'+h.title+'" 🏡'});save();render();toast('Cảm ơn nhà mình đã xung phong!');break}
    case 'unhost':{const h=S.hosts.find(x=>x.id===b.dataset.id),f=myFam();h.fid=null;h.rsvp={};h.note='';S.gold[f.id]=Math.max(0,(S.gold[f.id]||1)-1);if(!S.gold[f.id])delete S.gold[f.id];save();render();toast('Đã mở lại cho nhà khác xung phong');break}
    case 'vote':{const i=+b.dataset.i;if(S.poll.votes[S.me]===i)delete S.poll.votes[S.me];else S.poll.votes[S.me]=i;save();render();break}
    case 'wish':{post('general',{pid:S.me,x:'Chúc mừng '+b.dataset.t.split(' · ')[0].replace('Sinh nhật','sinh nhật').replace('Kỷ niệm','kỷ niệm').replace('Thôi nôi','thôi nôi')+' nhà '+famShort(famById(b.dataset.f))+'! 🎉'});save();render();toast('Đã gửi lời chúc vào kênh chung');break}
    case 'new-keo':sheetKeo();break;
    case 'new-host':sheetHost();break;
    case 'pick-me':sheetMe();break;
    case 'set-me':S.me=b.dataset.id;UI.checkOpen=false;save();closeSheet();render();toast('Đang xem với tư cách '+me().n);break;
    case 'ktype':document.querySelectorAll('#ktypes .chip').forEach(c=>c.setAttribute('aria-pressed',c===b));break;
    case 'offer':b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');break;
    case 'altar-open':sheetAltar();break;
    case 'invite':sheetInvite();break;
    case 'show-link':sheetLink(b.dataset.f);break;
    case 'copy-link':{const msg=b.dataset.msg;const done=()=>toast('Đã sao chép, dán vào Zalo là xong');
      try{navigator.clipboard.writeText(msg).then(done,()=>{selectMsg();toast('Bôi đen sẵn rồi, bấm giữ để sao chép')})}catch(err){selectMsg();toast('Bôi đen sẵn rồi, bấm giữ để sao chép')}break}
    case 'preview-claim':S.claim={fid:b.dataset.f,step:'who',by:S.me};closeSheet();save();render();scrollTo(0,0);break;
    case 'claim-who':S.claim.pid=b.dataset.p;S.claim.step='login';save();render();break;
    case 'claim-login':S.claim.step='profile';save();render();scrollTo(0,0);break;
    case 'claim-back':S.claim.step='who';save();render();break;
    case 'claim-exit':S.claim=null;save();render();break;
    case 'edit-fam':sheetFam();break;
    case 'add-kid':document.getElementById('kids').insertAdjacentHTML('beforeend',kidRow(null));document.querySelector('#kids .kid-row:last-child .kn').focus();break;
    case 'del-kid':b.closest('.kid-row').remove();break;
    case 'close':case 'close-btn':closeSheet();break;
    case 'reset':S=seed();UI={checkOpen:false,confirmCancel:false};save();render();scrollTo(0,0);toast('Đã khôi phục dữ liệu mẫu');break;
  }
});
function selectMsg(){const el=document.getElementById('msg-text');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}

document.addEventListener('submit',e=>{
  e.preventDefault();const F=e.target,v=id=>F.querySelector('#'+id).value.trim();
  switch(F.id){
    case 'keo-form':{const type=(document.querySelector('#ktypes .chip[aria-pressed="true"]')||{dataset:{k:'cafe'}}).dataset.k;
      const k={id:'k'+Date.now(),type,title:v('k-title'),when:new Date(v('k-when')).getTime(),place:v('k-place'),min:+v('k-min'),host:S.me,rsvp:{[S.me]:'yes'}};
      S.keo.push(k);post('general',{sys:1,x:me().n+' vừa rủ kèo '+ty(type).e+' '+k.title});
      S.tab='keo';S.sub='keo';S.detail=k.id;save();closeSheet();render();scrollTo(0,0);toast('Đã đăng kèo, chờ cả xóm hưởng ứng!');break}
    case 'host-form':{const f=myFam(),h={id:'h'+Date.now(),title:v('h-title'),when:new Date(v('h-when')).getTime(),fid:f.id,note:v('h-note'),rsvp:{}};
      adults(f).forEach(m=>{if(m.claimed)h.rsvp[m.id]='yes'});S.hosts.push(h);S.gold[f.id]=(S.gold[f.id]||0)+1;
      post('general',{sys:1,x:'Nhà '+famShort(f)+' xung phong đăng cai "'+h.title+'" 🏡'});save();closeSheet();render();toast('Đã đăng buổi mới, nhà mình làm chủ nhà!');break}
    case 'chat-form':{const x=v('chat-in');if(!x)return;post(F.dataset.ch,{pid:S.me,x});UI.scrollChat=true;save();render();const i=document.getElementById('chat-in');i&&i.focus();break}
    case 'altar-form':{const off=[...document.querySelectorAll('#offers .chip[aria-pressed="true"]')].map(c=>c.dataset.k);
      (S.altar[today]=S.altar[today]||[]).push({pid:S.me,t:Date.now(),off,wish:v('a-wish'),priv:F.querySelector('#a-priv').checked});
      save();closeSheet();playLight();break}
    case 'invite-form':{const n=S.fams.length;let id='f'+n;while(famById(id))id+='x';
      const A=v('i-a'),B=v('i-b'),ks=v('i-k').split(',').map(s=>s.trim()).filter(Boolean);
      const f={id,h:(n*67)%360,ab:(A[0]||'')+(B[0]||''),wed:'',invite:code(),members:[
        {id:'a'+id.slice(1),n:A,role:'adult',dob:'',claimed:false,phone:'',phonePub:false},
        {id:'b'+id.slice(1),n:B,role:'adult',dob:'',claimed:false,phone:'',phonePub:false},
        ...ks.map((k,i)=>({id:'k'+id.slice(1)+i,n:k,role:'kid',dob:''}))]};
      S.fams.push(f);save();render();sheetLink(f.id);break}
    case 'fam-form':{
      if(S.claim){const c=S.claim;S.me=c.pid;const f=readFamForm(F);const m=f.members.find(x=>x.id===c.pid);m.claimed=true;
        post('general',{sys:1,x:m.n+' (nhà '+famShort(f)+') vừa vào xóm 👋'});S.claim=null;S.tab='home';S.detail=null;save();render();scrollTo(0,0);toast('Chào mừng '+m.n+' đến với Xóm Mình!');
      }else{readFamForm(F);save();closeSheet();render();toast('Đã lưu hồ sơ nhà mình')}
      break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const RANGE={'ed-zoom':'zoom','ed-ox':'ox','ed-oy':'oy'};
document.addEventListener('input',e=>{const k=RANGE[e.target.id];if(!k)return;setLook(ED.pid,{[k]:+e.target.value});const pv=document.getElementById('ed-pv');if(pv)pv.innerHTML=chibiSVG(ED.pid)});
document.addEventListener('change',e=>{
  if(RANGE[e.target.id]){save();render();return}
  if(e.target.id==='td-date'&&e.target.value){UI.thay.date=e.target.value;UI.thay.keo=null;renderThay();return}
  if(e.target.id!=='ed-file')return;const file=e.target.files&&e.target.files[0];if(!file)return;
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const mx=320,sc=Math.min(1,mx/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const prev=(S.look||{})[ED.pid];setLook(ED.pid,{mode:'photo',photo:c.toDataURL('image/jpeg',.82),zoom:1.25,ox:0,oy:0});
    if(!save()){S.look[ED.pid]=prev;toast('Ảnh lớn quá, thử ảnh khác nhé')}renderEd();render()};
    img.onerror=()=>toast('Không đọc được ảnh này, thử ảnh khác nhé');img.src=r.result};r.readAsDataURL(file)});
render();
})();
</script>
</body></html>
